[package]
name = "securevault"
version = "0.2.0"
edition = "2021"
authors = ["Votre Nom <votre@email.com>"]
description = "Gestionnaire de mots de passe sécurisé"

[dependencies]
eframe = "0.22"
egui = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
arboard = "3.2"
uuid = { version = "1.4", features = ["v4", "serde"] }
typenum = "1.16"
rand_core = "0.6"
